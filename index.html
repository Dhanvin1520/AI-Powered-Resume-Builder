<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI-Powered Resume Builder</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
</head>
<body class="min-h-screen bg-gray-50 py-8">

    <div class="container mx-auto px-4">
        <h1 class="mb-8 text-center text-3xl font-bold text-gray-900">AI-Powered Resume Builder</h1>
        
        <div class="grid gap-8 md:grid-cols-2">
            
            <div class="space-y-6 rounded-lg bg-white p-6 shadow-lg">
                <div class="space-y-4">
                        <h2 class="text-xl font-semibold text-gray-900">Personal Information</h2>
                    <input type="text" id="fullName" placeholder="Full Name" class="w-full rounded border p-2">
                    <div class="grid gap-4 sm:grid-cols-2">
                        <input type="tel" id="phone" placeholder="Phone Number" class="w-full rounded border p-2">
                        <input type="email" id="email" placeholder="Email Address" class="w-full rounded border p-2">
        </div>
                    <div class="grid gap-4 sm:grid-cols-3">
                        <input type="url" id="linkedin" placeholder="LinkedIn URL" class="w-full rounded border p-2">
                        <input type="url" id="github" placeholder="GitHub URL" class="w-full rounded border p-2">
                        <input type="url" id="portfolio" placeholder="Portfolio URL" class="w-full rounded border p-2">
                    </div>
                </div>

                <div class="space-y-4">
                    <h2 class="text-xl font-semibold text-gray-900">Professional Summary</h2>
                    <textarea id="summary" placeholder="Write a brief professional summary..." class="w-full rounded border p-2 min-h-[100px]"></textarea>
                </div>

    <div class="space-y-4">
                    <h2 class="text-xl font-semibold text-gray-900">Education</h2>
         <div id="educationContainer">
                        <div class="education-entry space-y-4 mb-4">
                            <input type="text" placeholder="Degree/Certificate" class="w-full rounded border p-2">
                     <input type="text" placeholder="Institution" class="w-full rounded border p-2">
                            <div class="grid gap-4 sm:grid-cols-2">
                                <input type="text" placeholder="Year Started" class="w-full rounded border p-2">
                                <input type="text" placeholder="Year Completed" class="w-full rounded border p-2">
                            </div>
                        <input type="text" placeholder="Grade/Score" class="w-full rounded border p-2">
                        </div>
                    </div>
                    <button id="addEducation" class="bg-blue-500 text-white px-4 py-2 rounded">Add Another Education</button>
                </div>

                <div class="space-y-4">
                    <h2 class="text-xl font-semibold text-gray-900">Experience</h2>
                    <input type="text" id="jobTitle" placeholder="Job Title" class="w-full rounded border p-2">
 <input type="text" id="company" placeholder="Company" class="w-full rounded border p-2">
                    <div class="grid gap-4 sm:grid-cols-2">
        <input type="text" id="jobStartDate" placeholder="Start Date" class="w-full rounded border p-2">
                        <input type="text" id="jobEndDate" placeholder="End Date" class="w-full rounded border p-2">
                    </div>
                    <textarea id="jobDescription" placeholder="Job Description" class="w-full rounded border p-2 min-h-[100px]"></textarea>
                </div>

                <div class="space-y-4">
                    <h2 class="text-xl font-semibold text-gray-900">Projects</h2>
                    <div id="projectsContainer">
                        <div class="project-entry space-y-4 mb-4">
                            <input type="text" placeholder="Project Title" class="w-full rounded border p-2">
                            <textarea placeholder="Project Description" class="w-full rounded border p-2 min-h-[100px]"></textarea>
              <div class="grid gap-4 sm:grid-cols-2">
                                <input type="url" placeholder="GitHub URL" class="w-full rounded border p-2">
                                <input type="url" placeholder="Demo URL" class="w-full rounded border p-2">
                </div>
                        </div>
                    </div>
                    <button id="addProject" class="bg-blue-500 text-white px-4 py-2 rounded">Add Another Project</button>
                </div>

                <div class="space-y-4">
                    <h2 class="text-xl font-semibold text-gray-900">Skills</h2>
                    <div id="skillsContainer">
                        <div class="skill-entry flex items-center space-x-2 mb-2">
                            <input type="text" placeholder="Skill" class="flex-grow rounded border p-2">
                            <button class="remove-skill bg-red-500 text-white px-2 py-1 rounded">Remove</button>
                        </div>
                    </div>
                    <button id="addSkill" class="bg-blue-500 text-white px-4 py-2 rounded">Add Skill</button>
                </div>

                <div class="space-y-4">
                    <h2 class="text-xl font-semibold text-gray-900">Certifications</h2>
                    <textarea id="certifications" placeholder="List your certifications" class="w-full rounded border p-2 min-h-[100px]"></textarea>
                </div>

                <div class="space-y-4">
                    <h2 class="text-xl font-semibold text-gray-900">Extra-Curricular Activities</h2>
         <textarea id="activities" placeholder="List your extra-curricular activities" class="w-full rounded border p-2 min-h-[100px]"></textarea>
                </div>

                <div class="flex gap-4">
                    <button id="generateResume" class="flex-1 bg-blue-500 text-white px-4 py-2 rounded">Generate Resume</button>
                    <button id="downloadPDF" class="flex-1 bg-green-500 text-white px-4 py-2 rounded">Download PDF</button>
                </div>
            </div>

            <div id="previewPanel" class="hidden rounded-lg bg-white p-6 shadow-lg">
                <div class="space-y-6 print:space-y-4">
                    <div class="border-b pb-4">
                        <h1 id="previewName" class="text-2xl font-bold"></h1>
                        <div class="mt-2 space-y-1 text-sm text-gray-600">
          <p id="previewPhone"></p>
                            <p id="previewEmail"></p>
                       <div id="previewLinks" class="flex gap-4"></div>
                        </div>
                    </div>

                    <section class="border-b pb-4">
                        <h2 class="text-lg font-semibold uppercase tracking-wider text-gray-900">Professional Summary</h2>
                        <p id="previewSummary" class="mt-2 text-gray-600"></p>
                    </section>

                    <section class="border-b pb-4">
                        <h2 class="text-lg font-semibold uppercase tracking-wider text-gray-900">Education</h2>
                        <div id="previewEducation" class="mt-2 space-y-2"></div>
                    </section>

    <section id="previewExperienceSection" class="border-b pb-4 hidden">
      <h2 class="text-lg font-semibold uppercase tracking-wider text-gray-900">Experience</h2>
                        <div id="previewExperience" class="mt-2 space-y-2"></div>
                    </section>

                    <section class="border-b pb-4">
                        <h2 class="text-lg font-semibold uppercase tracking-wider text-gray-900">Projects</h2>
                        <div id="previewProjects" class="mt-2 space-y-4"></div>
                    </section>

             <section class="border-b pb-4">
                        <h2 class="text-lg font-semibold uppercase tracking-wider text-gray-900">Skills</h2>
                        <ul id="previewSkills" class="mt-2 list-disc pl-5 text-gray-600"></ul>
                  </section>

                    <section class="border-b pb-4">
                        <h2 class="text-lg font-semibold uppercase tracking-wider text-gray-900">Certifications</h2>
                        <p id="previewCertifications" class="mt-2 text-gray-600"></p>
         </section>

                    <section>
                        <h2 class="text-lg font-semibold uppercase tracking-wider text-gray-900">Extra-Curricular Activities</h2>
            <p id="previewActivities" class="mt-2 text-gray-600"></p>
                    </section>
                </div>
            </div>
        </div>
    </div>
    <script src="script.js"></script>

</body>
</html>
